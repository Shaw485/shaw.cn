<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="m036-csrf" content="__CSRF_TOKEN__" />
    <title>0.015B 自研模型 · 小说续写</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="/" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span class="brand-copy">
            <strong>0.015B 自研模型</strong>
            <small>手搓 GPT · Step 5750</small>
          </span>
        </a>
        <div class="model-status" id="model-status" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          正在连接
        </div>
      </header>

      <section class="chat" aria-label="小说续写体验">
        <div class="welcome" id="welcome">
          <h1>接着写一点</h1>
          <p>输入一个短语或半句话，模型续写一两句。</p>
        </div>

        <div class="answer" id="answer" aria-live="polite" hidden>
          <p>
            <span class="answer-prompt" id="answer-prompt"></span><span id="answer-continuation"></span>
          </p>
        </div>

        <div class="loading" id="loading" role="status" hidden>
          <span></span><span></span><span></span>
          <small>正在续写</small>
        </div>

        <form class="chat-composer" id="composer">
          <label class="sr-only" for="prompt">输入短语或半句话</label>
          <textarea
            id="prompt"
            maxlength="80"
            rows="1"
            placeholder="输入一个短语或半句话"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button type="submit" id="generate" aria-label="开始续写">
            <span aria-hidden="true">↑</span>
          </button>
        </form>

        <p class="error-message" id="error-message" role="alert"></p>
        <p class="usage-note">按 Enter 发送，Shift + Enter 换行</p>
      </section>

      <footer>
        <span>Step 5750 · ShawSpace 服务器 CPU 推理</span>
        <span>仅做小说续写；没有通过聊天或事实问答验收</span>
      </footer>
    </main>
  </body>
</html>
