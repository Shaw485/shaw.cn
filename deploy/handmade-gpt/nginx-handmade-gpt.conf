location = /handmade-gpt {
    return 308 /handmade-gpt/;
}

location = /handmade-gpt/api/generate {
    limit_req zone=shaw_gpt_demo_per_ip burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8772;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    proxy_pass http://127.0.0.1:8772/api/generate;
}

location /handmade-gpt/ {
    client_max_body_size 16k;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8772;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 45s;
    proxy_pass http://127.0.0.1:8772/;
}
