<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">搜索优化前后对照页面</title>
  <desc id="desc">左右两个搜索面板，优化前显示商品结果，优化后暂未支持。</desc>
  <rect width="1440" height="900" fill="#edf0f2"/>
  <rect width="1440" height="100" fill="#131e29"/>
  <text x="42" y="52" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Bench<tspan fill="#ff9900">Mart</tspan></text>
  <text x="42" y="73" fill="#aebbc6" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">SEARCH COMPARISON</text>
  <text x="720" y="57" fill="#b9c5cf" text-anchor="middle" font-family="Arial,sans-serif" font-size="12">同一商品集 · 两套搜索结果</text>
  <g font-family="Arial,sans-serif">
    <rect x="24" y="124" width="688" height="748" fill="#fff" stroke="#cfd5da"/><rect x="24" y="124" width="688" height="5" fill="#ff9900"/>
    <text x="54" y="183" fill="#9b670f" font-size="11" font-weight="700">01</text><text x="85" y="185" fill="#18212a" font-size="31" font-weight="700">优化前</text><rect x="602" y="157" width="78" height="28" rx="14" fill="#e3f4ed"/><circle cx="620" cy="171" r="4" fill="#16a477"/><text x="632" y="175" fill="#07694d" font-size="10" font-weight="700">已支持</text>
    <rect x="54" y="218" width="628" height="56" rx="6" fill="#fff" stroke="#131e29" stroke-width="2"/><text x="73" y="252" fill="#41505e" font-size="15">wireless mouse</text><rect x="624" y="218" width="58" height="56" fill="#ff9900"/><circle cx="650" cy="244" r="9" fill="none" stroke="#18212a" stroke-width="2.5"/><path d="m657 251 8 8" stroke="#18212a" stroke-width="2.5"/>
    <text x="54" y="315" fill="#18212a" font-size="13" font-weight="700">搜索结果</text><text x="682" y="315" fill="#657383" text-anchor="end" font-size="10">7 个结果 · 42 ms</text><line x1="54" y1="328" x2="682" y2="328" stroke="#d8dde3"/>
    <text x="54" y="378" fill="#9b670f" font-size="10" font-weight="700">#1</text><rect x="87" y="344" width="86" height="86" rx="4" fill="#f2eee8"/><text x="108" y="401" font-size="35">🖱️</text><text x="194" y="366" fill="#78838c" font-size="8">COMPUTER MICE</text><text x="194" y="389" fill="#18212a" font-size="15" font-weight="700">Bluetooth Ergonomic Wireless Mouse</text><text x="194" y="411" fill="#657383" font-size="10">Anker · Rechargeable silent mouse</text><text x="653" y="367" fill="#87919a" text-anchor="end" font-size="8">SCORE</text><text x="653" y="390" fill="#18212a" text-anchor="end" font-size="14" font-weight="700">1.6788</text>
    <line x1="54" y1="451" x2="682" y2="451" stroke="#d8dde3"/>
    <text x="54" y="501" fill="#9b670f" font-size="10" font-weight="700">#2</text><rect x="87" y="467" width="86" height="86" rx="4" fill="#edf0f4"/><text x="108" y="524" font-size="35">🖱️</text><text x="194" y="489" fill="#78838c" font-size="8">COMPUTER MICE</text><text x="194" y="512" fill="#18212a" font-size="15" font-weight="700">Wireless RGB Gaming Mouse</text><text x="194" y="534" fill="#657383" font-size="10">Razer · Low-latency rechargeable mouse</text><text x="653" y="490" fill="#87919a" text-anchor="end" font-size="8">SCORE</text><text x="653" y="513" fill="#18212a" text-anchor="end" font-size="14" font-weight="700">1.6788</text>
    <rect x="728" y="124" width="688" height="748" fill="#fff" stroke="#cfd5da"/><rect x="728" y="124" width="688" height="5" fill="#9da7b1"/>
    <text x="758" y="183" fill="#7e8993" font-size="11" font-weight="700">02</text><text x="789" y="185" fill="#18212a" font-size="31" font-weight="700">优化后</text><rect x="1296" y="157" width="88" height="28" rx="14" fill="#eef0f2"/><text x="1340" y="175" fill="#687582" text-anchor="middle" font-size="10" font-weight="700">暂未支持</text>
    <rect x="758" y="218" width="628" height="56" rx="6" fill="#f4f5f6" stroke="#c4cbd1" stroke-width="2"/><text x="777" y="252" fill="#929ca5" font-size="15">wireless mouse</text><rect x="1328" y="218" width="58" height="56" fill="#d7dce0"/><circle cx="1354" cy="244" r="9" fill="none" stroke="#89939c" stroke-width="2.5"/><path d="m1361 251 8 8" stroke="#89939c" stroke-width="2.5"/>
    <text x="758" y="315" fill="#18212a" font-size="13" font-weight="700">搜索结果</text><text x="1386" y="315" fill="#657383" text-anchor="end" font-size="10">0 个结果</text><line x1="758" y1="328" x2="1386" y2="328" stroke="#d8dde3"/>
    <rect x="758" y="348" width="628" height="486" fill="#f7f8f9" stroke="#c9d0d6" stroke-dasharray="6 5"/><circle cx="1072" cy="558" r="38" fill="#e8ebed"/><circle cx="1066" cy="551" r="13" fill="none" stroke="#9aa4ad" stroke-width="2"/><path d="m1076 561 13 13" stroke="#9aa4ad" stroke-width="2"/><text x="1072" y="625" fill="#78838d" text-anchor="middle" font-size="15" font-weight="700">优化后搜索暂未支持</text>
  </g>
</svg>
