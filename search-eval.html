<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="搜索引擎优化前后商品搜索结果对照体验。">
    <title>搜索结果对照 · Shaw's Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260825-search-eval">
    <link rel="stylesheet" href="css/search-eval.css?v=20260828-catalog">
</head>
<body class="search-eval-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-mark"></span>
                <span class="logo-text">Shaw's Space</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link active">作品集</a></li>
                <li><a href="ai-growth.html" class="nav-link">AI 学习记录</a></li>
                <li><a href="blog.html" class="nav-link">博客记录</a></li>
                <li><a href="contact.html" class="nav-link">联系我</a></li>
            </ul>
            <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main class="comparison-page">
        <header class="store-bar">
            <a class="store-brand" href="search-eval.html" aria-label="BenchMart 搜索对照页">
                <span>Bench<b>Mart</b></span>
                <small>SEARCH COMPARISON</small>
            </a>
            <span class="store-bar-title">Amazon ESCI 全量商品 · 两套搜索结果</span>
            <div class="store-links">
                <a class="store-strategy" href="search-strategy.html">策略平台</a>
                <a class="store-back" href="index.html">返回作品集</a>
            </div>
        </header>

        <section class="comparison-grid" aria-label="搜索引擎优化前后对照">
            <article class="search-lane baseline-lane">
                <header class="lane-header">
                    <div>
                        <span class="lane-number">01</span>
                        <h1>优化前</h1>
                    </div>
                    <span class="lane-status lane-status-live"><i></i> 已支持</span>
                </header>

                <form class="lane-search" id="baselineSearchForm" role="search">
                    <label class="sr-only" for="baselineQuery">在优化前搜索中输入商品</label>
                    <input id="baselineQuery" type="search" value="wireless mouse" maxlength="200" autocomplete="off" placeholder="输入英文商品名，如 wireless mouse" required>
                    <button type="submit" aria-label="执行优化前搜索">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
                    </button>
                </form>

                <div class="results-heading">
                    <strong>搜索结果</strong>
                    <span id="baselineMeta" aria-live="polite">正在搜索…</span>
                </div>
                <div class="result-state" id="baselineState" aria-live="polite">
                    <span class="state-spinner"></span>
                    <p>正在搜索商品…</p>
                </div>
                <div class="product-list" id="baselineResults"></div>
            </article>

            <article class="search-lane optimized-lane">
                <header class="lane-header">
                    <div>
                        <span class="lane-number">02</span>
                        <h2>优化后</h2>
                    </div>
                    <span class="lane-status lane-status-pending">暂未支持</span>
                </header>

                <form class="lane-search lane-search-disabled" role="search" aria-label="优化后搜索暂未支持">
                    <label class="sr-only" for="optimizedQuery">优化后搜索</label>
                    <input id="optimizedQuery" type="search" value="wireless mouse" disabled>
                    <button type="button" aria-label="优化后搜索暂未支持" disabled>
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
                    </button>
                </form>

                <div class="results-heading">
                    <strong>搜索结果</strong>
                    <span>0 个结果</span>
                </div>
                <div class="pending-results">
                    <div class="pending-icon" aria-hidden="true">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
                    </div>
                    <strong>优化后搜索暂未支持</strong>
                </div>
            </article>
        </section>
    </main>

    <script src="js/search-console-store.js?v=20260828-console"></script>
    <script src="js/search-eval.js?v=20260828-catalog"></script>
</body>
</html>
